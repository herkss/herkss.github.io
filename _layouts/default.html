<!doctype html>
<html lang="ko" class="no-js">
  <head>
    {% include head.html %} <!-- 테마의 기본 설정을 그대로 가져와 에러 방지 -->
    <style>
      /* 3단 레이아웃을 위한 필수 스타일 추가 */
      .masthead { border-bottom: 1px solid #f2f3f3; }
      .initial-content { 
        display: flex; 
        justify-content: center; 
        padding: 2em 1em;
        max-width: 1280px;
        margin: 0 auto;
      }
      /* 사이드바와 본문 배치 */
      .sidebar { width: 260px; padding-right: 20px; }
      .archive { flex: 1; min-width: 0; }
    </style>
  </head>

  <body class="layout--{{ page.layout | default: layout.layout }}">
    <!-- 에러가 났던 부분을 테마 표준 파일로 교체 -->
    {% include masthead.html %} 

    <div class="initial-content">
      <!-- 왼쪽 사이드바 (프로필 및 navigation.yml 메뉴) -->
      <div class="sidebar">
        {% include sidebar.html %}
      </div>

      <!-- 중앙 본문 내용 -->
      <main class="archive">
        {{ content }}
      </main>
    </div>

    {% include footer.html %}
    {% include scripts.html %}
  </body>
</html>
