<!DOCTYPE html>
<html>
<head>
  <base href="/am_shooter/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="AM Shooter — 1942 스타일 세로 스크롤 우주 슈팅게임">
  <meta name="theme-color" content="#000010">

  <!-- Open Graph (SNS 공유용) -->
  <meta property="og:title" content="AM Shooter">
  <meta property="og:description" content="우주 슈팅게임 — 10종 무기, 보스 배틀, 스테이지 클리어">
  <meta property="og:type" content="website">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AM Shooter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>AM Shooter</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000010;
      overflow: hidden;
      font-family: sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000010;
      color: #00e5ff;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #loading .title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 6px;
      text-shadow: 0 0 20px #00e5ff;
      margin-bottom: 12px;
    }
    #loading .sub {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #ffffff66;
      margin-bottom: 40px;
    }
    #loading .bar-wrap {
      width: 200px;
      height: 4px;
      background: #ffffff18;
      border-radius: 2px;
      overflow: hidden;
    }
    #loading .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00e5ff, #40c4ff);
      border-radius: 2px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%   { width: 20%; }
      50%  { width: 80%; }
      100% { width: 20%; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="title">AM SHOOTER</div>
    <div class="sub">LOADING...</div>
    <div class="bar-wrap"><div class="bar"></div></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      const el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 700); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
