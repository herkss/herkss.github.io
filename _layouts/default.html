<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    {% include head.html %} <!-- 테마의 기본 head를 포함하여 CSS/JS 오류 원천 차단 -->
    <style>
      /* 개발자님이 요청하신 3단 레이아웃을 위한 최소한의 추가 스타일 */
      .masthead { border-bottom: 1px solid #f2f3f3; }
      .initial-content { padding-top: 2em; }
      /* 배달길 앱 네온 테마 스타일 포인트 */
      .page__title { color: #2c3e50; border-bottom: 3px solid #00FFD1; display: inline-block; }
    </style>
  </head>

  <body class="layout--{{ page.layout | default: layout.layout }}">
    {% include skip-links.html %}
    {% include navigation.html %} <!-- navigation.yml의 메뉴를 상단에 배치 -->

    <div class="initial-content">
      {{ content }}
    </div>

    {% include footer.html %}
    {% include scripts.html %}
  </body>
</html>
