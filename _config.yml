# 기본 정보
title: "허갱소프트"
url: "https://herkss.github.io"
baseurl: "" # 저장소 이름이 herkss.github.io이므로 빈값 유지

# 테마 설정 (Minimal Mistakes)
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dirt" # 분석하신 skin 유지

# 댓글 설정
comments:
  provider: "disqus"
  disqus:
    shortname: "herkss"

# 빌드 설정
plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed

# 파일 분석 결과에 따른 경로 포함
include:
  - _pages
  - _data
  - assets
  - assets/image/man
  - assets/image
  - app-ads.txt

# 포스트 기본 설정
defaults:
  # 포스트 기본값
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true       # Disqus 댓글 활성화
      share: true
      related: true
      sidebar:
        nav: "sidebar-menu"  # ← 포스트에 좌측 사이드바 메뉴 적용

  # 페이지 기본값
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      sidebar:
        nav: "sidebar-menu"  # ← 페이지에 좌측 사이드바 메뉴 적용
