<!DOCTYPE html>
<html>
<head>
  <base href="/block-blitz-3d/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Block Blitz 3D — 3D 블록 퍼즐 게임">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Block Blitz 3D">
  <meta name="theme-color" content="#04040F">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Block Blitz 3D</title>
  <link rel="manifest" href="manifest.json">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: radial-gradient(ellipse at 50% 20%, #0d0d40 0%, #000005 100%);
    }

    /* Flutter가 실제로 렌더링되는 컨테이너 */
    #flutter-target {
      width: 100%;
      max-width: 430px;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #04040F;
      box-shadow:
        0 0 80px rgba(0, 245, 255, 0.08),
        -4px 0 30px rgba(0, 0, 0, 0.8),
         4px 0 30px rgba(0, 0, 0, 0.8);
    }

    /* 로딩 화면 */
    #loading {
      position: absolute;
      inset: 0;
      background: #04040F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 28px;
      pointer-events: none;
    }

    #loading h1 {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #00F5FF, #BF5FFF, #FF3CAC);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #loading .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.30);
      letter-spacing: 3px;
    }

    #loading .dots {
      display: flex;
      gap: 10px;
    }

    #loading .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    #loading .dot:nth-child(1) { background: #00F5FF; animation-delay: 0.0s; }
    #loading .dot:nth-child(2) { background: #BF5FFF; animation-delay: 0.2s; }
    #loading .dot:nth-child(3) { background: #FF3CAC; animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
      40%            { transform: scale(1.1); opacity: 1.0; }
    }

    #loading.fade-out {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <div id="flutter-target">
    <div id="loading">
      <h1>⚡ BLOCK BLITZ 3D</h1>
      <p class="subtitle">LOADING...</p>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 600);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
