<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AM Shooter — 1942 스타일 세로 스크롤 우주 슈팅게임">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AM Shooter">
  <meta name="theme-color" content="#000010">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>AM Shooter</title>
  <link rel="manifest" href="manifest.json">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: radial-gradient(ellipse at 50% 20%, #000830 0%, #000010 100%);
    }

    /* Flutter 렌더링 컨테이너 — 스마트폰 화면 크기 */
    #flutter-target {
      width: 100%;
      max-width: 430px;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #000010;
      box-shadow:
        0 0 80px rgba(0, 229, 255, 0.08),
        -4px 0 30px rgba(0, 0, 0, 0.8),
         4px 0 30px rgba(0, 0, 0, 0.8);
    }

    /* 로딩 화면 */
    #loading {
      position: absolute;
      inset: 0;
      background: #000010;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 20px;
      pointer-events: none;
    }

    #loading .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #00e5ff;
      text-shadow: 0 0 20px #00e5ff, 0 0 40px #00e5ff44;
    }

    #loading .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.30);
      letter-spacing: 3px;
    }

    #loading .dots {
      display: flex;
      gap: 10px;
    }

    #loading .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    #loading .dot:nth-child(1) { background: #00e5ff; animation-delay: 0.0s; }
    #loading .dot:nth-child(2) { background: #40c4ff; animation-delay: 0.2s; }
    #loading .dot:nth-child(3) { background: #00bcd4; animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
      40%            { transform: scale(1.1); opacity: 1.0; }
    }

    #loading.fade-out {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <div id="flutter-target">
    <div id="loading">
      <div class="title">🚀 AM SHOOTER</div>
      <p class="subtitle">LOADING...</p>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 600);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
