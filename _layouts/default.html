<div class="layout">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <nav>
      <ul>
        {% for item in site.data.navigation.sidebar %}
          <li>
            <a href="{{ item.url }}">{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </aside>

  <!-- RIGHT CONTENT -->
  <main class="content">
    {{ content }}
  </main>

</div>
