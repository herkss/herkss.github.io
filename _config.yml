# 기본 정보
title: "허갱소프트"
url: "https://herkss.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dirt"

comments:
  provider: "disqus"
  disqus:
    shortname: "herkss"

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed

include:
  - _pages
  - _data
  - assets
  - assets/image/man
  - assets/image
  - app-ads.txt

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      # sidebar 제거 - default.html 커스텀 사이드바 사용

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      # sidebar 제거 - default.html 커스텀 사이드바 사용
