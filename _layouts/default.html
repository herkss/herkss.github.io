---
layout: compress
---
<!doctype html>
<html lang="ko" class="no-js">
<head>
  {% include head.html %}
  <link rel="shortcut icon" href="{{ '/assets/favicon.png' | relative_url }}">
  <style>
    /* ── 전체 레이아웃 ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 상단 마스트헤드는 그대로 유지 */
    .masthead { flex-shrink: 0; z-index: 200; }

    /* 마스트헤드 아래 좌우 분할 영역 */
    #frame-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── 좌측 사이드바 ── */
    #left-sidebar {
      width: 220px;
      min-width: 220px;
      background: #1a1a2e;
      color: #eee;
      overflow-y: auto;
      padding: 16px 0;
      border-right: 1px solid #2d2d4e;
      transition: width 0.25s ease;
      flex-shrink: 0;
    }

    #left-sidebar .sidebar-logo {
      display: block;
      padding: 0 16px 16px;
      font-size: 1rem;
      font-weight: 700;
      color: #f5a623;
      text-decoration: none;
      border-bottom: 1px solid #2d2d4e;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    /* 카테고리 헤더 */
    #left-sidebar .nav-category {
      font-size: 0.7rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 14px 16px 4px;
    }

    /* 메뉴 항목 */
    #left-sidebar a.nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px 9px 20px;
      color: #ccc;
      text-decoration: none;
      font-size: 0.88rem;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      cursor: pointer;
    }

    #left-sidebar a.nav-item:hover {
      background: #252545;
      color: #fff;
      border-left-color: #f5a623;
    }

    #left-sidebar a.nav-item.active {
      background: #2d2d5e;
      color: #f5a623;
      border-left-color: #f5a623;
      font-weight: 600;
    }

    /* 접기/펼치기 토글 버튼 */
    #sidebar-toggle {
      position: absolute;
      top: 70px;
      left: 220px;
      z-index: 300;
      background: #1a1a2e;
      border: 1px solid #2d2d4e;
      border-left: none;
      color: #f5a623;
      width: 20px;
      height: 40px;
      cursor: pointer;
      font-size: 10px;
      border-radius: 0 4px 4px 0;
      transition: left 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.sidebar-collapsed #left-sidebar {
      width: 0;
      min-width: 0;
      padding: 0;
      overflow: hidden;
    }

    body.sidebar-collapsed #sidebar-toggle {
      left: 0;
    }

    /* ── 우측 콘텐츠 iframe ── */
    #right-content {
      flex: 1;
      overflow: hidden;
      background: #f5f5f5;
      position: relative;
    }

    #right-content iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 로딩 오버레이 */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      gap: 12px;
      font-size: 0.9rem;
      color: #555;
      transition: opacity 0.3s;
    }

    #loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #ddd;
      border-top-color: #f5a623;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 모바일 ── */
    @media (max-width: 768px) {
      #left-sidebar { width: 180px; min-width: 180px; }
      #sidebar-toggle { left: 180px; top: 60px; }
      body.sidebar-collapsed #sidebar-toggle { left: 0; }
    }
  </style>
</head>

<body class="layout--sidebar-frame">
  {% include skip-links.html %}
  {% include masthead.html %}

  <!-- 접기 토글 버튼 -->
  <button id="sidebar-toggle" title="사이드바 열기/닫기">▶</button>

  <div id="frame-wrapper">

    <!-- 좌측 고정 사이드바 -->
    <nav id="left-sidebar">
      <a class="sidebar-logo" href="/" data-url="/">🏠 허갱소프트</a>

      <div class="nav-category">📱 앱 소개</div>
      <a class="nav-item" href="/apps/" data-url="/apps/">전체 앱 목록</a>
      <a class="nav-item" href="/baedalgil/" data-url="/baedalgil/">🛵 배달길2</a>
      <a class="nav-item" href="/apps/" data-url="/apps/">🎮 Amazing Game</a>
      <a class="nav-item" href="/apps/" data-url="/apps/">📄 PDF &amp; Viewer</a>

      <div class="nav-category">🎮 미니게임</div>
      <a class="nav-item" href="/shooter/" data-url="/shooter/">🚀 AM Shooter</a>
      <a class="nav-item" href="/block/" data-url="/block/">🧱 Block Game</a>
      <a class="nav-item" href="/block-blitz-3d/" data-url="/block-blitz-3d/">💎 Block Blitz 3D</a>

      <div class="nav-category">📖 사용 가이드</div>
      <a class="nav-item" href="/userguide/" data-url="/userguide/">배달길2 사용법</a>
      <a class="nav-item" href="/posts/" data-url="/posts/">앱 업데이트 내역</a>

      <div class="nav-category">ℹ️ 정보</div>
      <a class="nav-item" href="/info/" data-url="/info/">개발자 소개</a>
    </nav>

    <!-- 우측 콘텐츠 영역 -->
    <div id="right-content">
      <div id="loading-overlay">
        <div class="spinner"></div>
        <span>페이지 불러오는 중...</span>
      </div>
      <iframe id="content-frame" src="{{ page.url | default: '/' }}" title="콘텐츠 영역"></iframe>
    </div>

  </div>

  {% include scripts.html %}

  <script>
    (function() {
      const frame = document.getElementById('content-frame');
      const overlay = document.getElementById('loading-overlay');
      const toggleBtn = document.getElementById('sidebar-toggle');
      const navItems = document.querySelectorAll('#left-sidebar a.nav-item');

      // ── iframe 로딩 처리 ──
      frame.addEventListener('load', () => {
        overlay.classList.add('hidden');
      });

      function loadPage(url) {
        overlay.classList.remove('hidden');
        frame.src = url;
        // URL 업데이트 (뒤로가기 지원)
        history.pushState({ url }, '', url);
        // active 상태 업데이트
        updateActive(url);
      }

      function updateActive(url) {
        navItems.forEach(item => {
          const iurl = item.getAttribute('data-url');
          item.classList.toggle('active', url === iurl || url.startsWith(iurl) && iurl !== '/');
        });
      }

      // ── 메뉴 클릭 → iframe 로드 ──
      document.querySelectorAll('#left-sidebar a').forEach(link => {
        link.addEventListener('click', e => {
          const url = link.getAttribute('data-url') || link.getAttribute('href');
          if (!url || url.startsWith('http')) return; // 외부 링크는 그냥 이동
          e.preventDefault();
          loadPage(url);
        });
      });

      // ── 뒤로가기/앞으로가기 지원 ──
      window.addEventListener('popstate', e => {
        if (e.state && e.state.url) loadPage(e.state.url);
      });

      // ── 사이드바 접기/펼치기 ──
      toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('sidebar-collapsed');
        const collapsed = document.body.classList.contains('sidebar-collapsed');
        toggleBtn.textContent = collapsed ? '▶' : '◀';
        toggleBtn.style.left = collapsed ? '0' : '';
      });

      // ── 초기 active 설정 ──
      updateActive(window.location.pathname);

      // ── Chatbase 봇 ──
      if (!window.chatbase || window.chatbase("getState") !== "initialized") {
        window.chatbase = (...args) => { (window.chatbase.q = window.chatbase.q||[]).push(args); };
        window.chatbase = new Proxy(window.chatbase, {
          get(t, p) { return p === "q" ? t.q : (...a) => t(p, ...a); }
        });
      }
      const s = document.createElement("script");
      s.src = "https://www.chatbase.co/embed.min.js";
      s.id = "N1_ZF-X9asHvxXXlMJMdI";
      s.domain = "www.chatbase.co";
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
