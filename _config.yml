title: "HERGANG SOFT"
url: "https://your-id.github.io" # 본인의 깃허브 주소로 변경 필수
baseurl: "" # 하위 경로가 없다면 비워둡니다

# 테마 설정
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "contrast"

# 중요: 상단 메뉴(masthead) 활성화
# 별도의 navigation.yml을 사용하더라도 기본 설정이 필요할 수 있습니다.
# Minimal Mistakes는 기본적으로 _data/navigation.yml의 'main'을 참조합니다.

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme # remote_theme 사용 시 필수 플러그인

# 사이드바 설정
sidebar:
  nav: "docs" 

include:
  - _pages
  - _data # 데이터 폴더 명시
